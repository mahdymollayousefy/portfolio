# /opt/projects/portfolio_mahdymollayousefy/docker-compose.prod.yml
# Portfolio project — Django + Next.js + PostgreSQL + Redis + Celery
# Isolated internal network for DB/Redis. Backend & Frontend on global-proxy-network.

name: portfolio-prod

services:
  db:
    image: postgres:16-alpine
    container_name: portfolio_prod_db
    restart: unless-stopped
    env_file:
      - .env.prod
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - portfolio_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: portfolio_prod_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 128mb --maxmemory-policy allkeys-lru
    networks:
      - portfolio_internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  backend:
    build:
      context: ./backend
    container_name: portfolio_prod_backend
    restart: unless-stopped
    env_file:
      - .env.prod
    volumes:
      - media_data:/app/media
    command: >
      sh -c "
        python manage.py collectstatic --noinput &&
        python manage.py migrate --noinput &&
        python manage.py createsuperuser --noinput || true &&
        gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 2 --timeout 120 --access-logfile - --error-logfile -
      "
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - portfolio_internal
      - global-proxy-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/status/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  celery_worker:
    build:
      context: ./backend
    container_name: portfolio_prod_celery
    restart: unless-stopped
    env_file:
      - .env.prod
    command: celery -A config worker -l info --concurrency=2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - portfolio_internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
    container_name: portfolio_prod_frontend
    restart: unless-stopped
    networks:
      - global-proxy-network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  postgres_prod_data:
    name: portfolio_prod_pg_data
  media_data:
    name: portfolio_prod_media_data

networks:
  portfolio_internal:
    driver: bridge
    internal: true
  global-proxy-network:
    external: true
